[workspace]
resolver = "2"
members = ["crates/ds-rules", "crates/ds-core-rpc", "crates/dsverify"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["Doge Soft <koinu@dogesoft.io>"]
repository = "https://github.com/builderdogecoin/dogesoftio"
homepage = "https://dogesoft.io"

[workspace.dependencies]
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
debug = false
incremental = false
