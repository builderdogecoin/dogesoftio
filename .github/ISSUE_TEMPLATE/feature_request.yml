name: Feature request
description: An idea to make Doge Soft better for every Doge Kin.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or wish, in plain words.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [dsverify, Rules or test vectors, Proofs, Explorer API, sdk-js, sdk-rust, Docs, Other]
